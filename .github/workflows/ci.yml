name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Core tests (no provider keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install core and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (enforced)
        run: |
          black --check src tests eval
          isort --check-only src tests eval
          flake8 src tests eval
      - name: Type check (src)
        run: mypy src
      - name: Security lint (bandit, medium+)
        run: bandit -r src -ll -q
      - name: Unit and contract tests
        env:
          APP_ENV_FILE: /nonexistent/.env
          ANONYMIZED_TELEMETRY: "False"
        run: pytest tests -q --cov=src --cov=eval --cov-report=term-missing
      - name: Evaluation smoke run (lexical, no key)
        env:
          APP_ENV_FILE: /nonexistent/.env
          ANONYMIZED_TELEMETRY: "False"
        run: python -m eval.run_eval --embedding none --out eval/results/ci-lexical.json
      - name: Evaluation plumbing run (hash embeddings)
        env:
          APP_ENV_FILE: /nonexistent/.env
          ANONYMIZED_TELEMETRY: "False"
        run: python -m eval.run_eval --embedding hash --out eval/results/ci-hash.json
      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/ci-*.json

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: doc-intel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Ingest and search inside the container
        run: bash scripts/docker/smoke_test.sh doc-intel:ci

  security-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trivy filesystem scan (advisory)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"
      - name: Secret scan (enforced)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
