apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-intelligence-api
  namespace: document-intelligence
spec:
  replicas: 3
  selector:
    matchLabels:
      app: doc-intelligence-api
  template:
    metadata:
      labels:
        app: doc-intelligence-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: cbratkovics/document-intelligence-ai:latest
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: doc-intelligence-secrets
              key: OPENAI_API_KEY
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: doc-intelligence-secrets
              key: REDIS_PASSWORD
        envFrom:
        - configMapRef:
            name: doc-intelligence-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: app-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: doc-intelligence-service
  namespace: document-intelligence
  labels:
    app: doc-intelligence-api
spec:
  selector:
    app: doc-intelligence-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
  - name: metrics
    port: 9090
    targetPort: 9090
  type: LoadBalancer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data-pvc
  namespace: document-intelligence
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doc-intelligence-hpa
  namespace: document-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: doc-intelligence-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80