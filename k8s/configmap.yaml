apiVersion: v1
kind: ConfigMap
metadata:
  name: doc-intelligence-config
  namespace: document-intelligence
data:
  APP_NAME: "Document Intelligence RAG System"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"
  
  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # ChromaDB Configuration
  CHROMADB_HOST: "chromadb-service"
  CHROMADB_PORT: "8000"
  CHROMADB_COLLECTION: "documents"
  
  # Embedding Configuration
  EMBEDDING_MODEL: "text-embedding-ada-002"
  EMBEDDING_DIMENSION: "1536"
  
  # Chunking Configuration
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "128"
  CHUNKING_STRATEGY: "semantic"
  
  # Cache Configuration
  CACHE_TTL: "3600"
  CACHE_STRATEGY: "hybrid"
  SEMANTIC_CACHE_THRESHOLD: "0.95"
  
  # Search Configuration
  HYBRID_SEARCH_VECTOR_WEIGHT: "0.6"
  HYBRID_SEARCH_BM25_WEIGHT: "0.4"
  SEARCH_TOP_K: "10"
  RERANK_TOP_K: "20"
  
  # Monitoring
  PROMETHEUS_PORT: "9090"
  METRICS_ENABLED: "true"