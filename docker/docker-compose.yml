# Local run of the API with persistent storage. No external services are
# required: the manifest is SQLite and the vector index is embedded Chroma.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Set OPENAI_API_KEY in your shell (or a .env file next to this compose file)
# to enable dense retrieval and answer generation.
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_KEY: ${API_KEY:-}
      STORAGE_MODE: persistent
      DATA_DIR: /app/data
      LOG_LEVEL: INFO
    volumes:
      - doc-intel-data:/app/data

volumes:
  doc-intel-data:
